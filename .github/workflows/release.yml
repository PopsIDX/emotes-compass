name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 📦 Package and publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 🗜️ Build the zip and create the release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
